<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
    // One link for every screen: a phone plays full screen here; a computer (a mouse and a wide
    // window) opens the game inside a phone-shaped frame. Inside that frame this page is not the
    // top window, so it stays.
    // index.html starts with this same script (and sends a link with no room here).
    if (window.top === window) {
      const path = location.pathname;
      if (!/\/$|\.html$/.test(path)) location.replace(path + "/" + location.search);
      else if (matchMedia("(hover: hover) and (pointer: fine)").matches && innerWidth > innerHeight * 0.75) {
        const q = new URLSearchParams(location.search);
        const page = path.split("/").pop();
        if (page && page !== "index.html") q.set("page", page);
        const s = q.toString(); // not q.size: Safari before 17 has no size
        location.replace("frame.html" + (s ? "?" + s : ""));
      }
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a110c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grandma's House</title>
  <link rel="stylesheet" href="meta/home.9c0189c88f.css" />
  <link rel="preload" as="image" href="meta/art/home_bg.webp" />
</head>
<body>
  <!-- The home screen: grandma's wall, one picture frame per room. A frame holds the keepsake once
       its room is done; the big button plays the next room. Built by meta/home.js. -->
  <main id="wall">
    <svg id="yarn" aria-hidden="true"></svg>
    <div id="frames"></div>
    <button id="cat" aria-label="cat"></button>
  </main>

  <div id="hud">
    <div id="coins" class="pill"><img src="meta/icons/er-coin.png" alt="" /><b>0</b></div>
  </div>

  <div id="dock">
    <button id="play" class="big"><span>Level 1</span></button>
  </div>

  <!-- A room just done: its keepsake and coins, collected with one tap. -->
  <div id="reward" class="layer">
    <div class="card">
      <div class="photo"><img alt="" /></div>
      <div class="gain"><img src="meta/icons/er-coin.png" alt="" /><b>+15</b></div>
      <button id="collect" class="big"><span>Collect</span></button>
    </div>
  </div>

  <!-- A keepsake on the wall, looked at close; the round button plays its room again. -->
  <div id="look" class="layer">
    <div class="card">
      <div class="photo"><img alt="" /></div>
      <button id="replay" class="round" aria-label="play again">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M35.5 17.5A13 13 0 1 0 37 28" fill="none" stroke="#2a1a10" stroke-width="5" stroke-linecap="round"/>
          <path d="M38.5 8.5 37 19.5 26.5 17z" fill="#2a1a10" stroke="#2a1a10" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="meta/home.9564ae25ec.js"></script>
</body>
</html>
