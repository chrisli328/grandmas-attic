<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grandma's Attic</title>
  <script>
    // ?page=<name>.html is the page that sent the computer here (none = index.html); the rest of
    // the query is that page's own. A phone that lands here goes straight to that page.
    const q = new URLSearchParams(location.search);
    const page = /^[\w-]+\.html$/.test(q.get("page") || "") ? q.get("page") : "";
    q.delete("page");
    const rest = q.toString(); // not q.size: Safari before 17 has no size
    const inner = "./" + page + (rest ? "?" + rest : "");
    if (!matchMedia("(hover: hover) and (pointer: fine)").matches) location.replace(inner);
  </script>
  <style>
    /* The game is portrait mobile; on a computer it plays in a phone-shaped frame (390 x 844,
       an iPhone 14 screen) scaled to the window height. Mouse drag = finger swipe. */
    html, body { margin: 0; height: 100%; background: #2b1d14; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #4a3222, #1f150e 75%); }
    .phone {
      height: min(calc(100vh - 48px), 900px); aspect-ratio: 390 / 844;
      border-radius: 34px; padding: 10px; background: #1d1612;
      box-shadow: 0 0 0 2px #3a2c22, 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 26px; display: block; background: #120b07; }
  </style>
</head>
<body>
  <div class="phone"><iframe id="game" title="Grandma's Attic" allow="autoplay; fullscreen"></iframe></div>
  <script>
    const f = document.getElementById("game");
    f.src = inner;
    f.addEventListener("load", () => f.focus());
  </script>
</body>
</html>
